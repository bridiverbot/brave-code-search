<!doctype html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <title>GCM Internals</title>
  
    <meta name="viewport" content="width=device-width">
  
  <link rel="stylesheet" href="chrome://resources/css/text_defaults.css">
  <link rel="stylesheet" href="gcm_internals.css">
  <script type="module" src="gcm_internals.js"></script>
</head>
<body>
<h1>GCM Internals</h1>
<div class="flexbar">
  <button id="refresh">Refresh</button>
  <button id="recording">Start Recording</button>
  <button id="clear-logs">Clear All Logs</button>
</div>

<h2>Device Info</h2>
<table id="device-info">
  <tbody>
    
    <tr>
      <td>
        GCM Enabled
      </td>
      <td id="gcm-enabled">
      </td>
    </tr>
    
  </tbody>
</table>



<h2>Registration Log</h2>
<table class="log-table">
  <thead>
    <tr>
      <th>Time</th>
      <th>App Id</th>
      <th>Source</th>
      <th>Event</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="registration-info">
  </tbody>
</table>

<h2>Receive Message Log</h2>
<table class="log-table">
  <thead>
    <tr>
      <th>Time</th>
      <th>App Id</th>
      <th>From</th>
      <th>Size (bytes)</th>
      <th>Event</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="receive-info">
  </tbody>
</table>

<h2>Message Decryption Failure Log</h2>
<table class="log-table">
  <thead>
    <tr>
      <th>Time</th>
      <th>App Id</th>
      <th>Details</th>
    </tr>
  </thead>
  <tbody id="decryption-failure-info">
  </tbody>
</table>



</body>
</html>
